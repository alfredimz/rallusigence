<!doctype html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;background:#fff;padding:22px;font-family:var(--font-primary);color:var(--rs-text);}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px;}
.btn{display:inline-flex;align-items:center;justify-content:center;height:48px;padding:12px 24px;font-family:var(--font-primary);font-weight:500;font-size:16px;line-height:1.2;border-radius:4px;text-decoration:none;cursor:pointer;border:none;transition:all .2s ease-in-out;}
.btn-primary{background:#20B4B1;color:#fff;}
.btn-primary.hover{background:#198C76;transform:translateY(-1px);box-shadow:0 4px 12px rgba(32,180,177,.15);}
.btn-primary.active{background:#10AE8F;}
.btn-primary.disabled{opacity:.5;cursor:not-allowed;}
.btn-secondary{background:transparent;color:#20B4B1;border:1px solid #20B4B1;}
.btn-secondary.hover{background:rgba(32,180,177,.05);}
.btn-ghost{background:transparent;color:#20B4B1;height:auto;padding:8px 0;}
.btn-ghost.hover{text-decoration:underline;text-underline-offset:4px;}
.lab{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--rs-text-subtle);font-weight:700;margin-bottom:8px;}
.section+ .section{margin-top:8px;}
</style></head><body>
<div class="section">
  <div class="lab">Primary · 48 px</div>
  <div class="row">
    <button class="btn btn-primary">Solicitar auditoría</button>
    <button class="btn btn-primary hover">Solicitar auditoría</button>
    <button class="btn btn-primary active">Solicitar auditoría</button>
    <button class="btn btn-primary disabled">Disabled</button>
  </div>
</div>
<div class="section">
  <div class="lab">Secondary · borde teal</div>
  <div class="row">
    <button class="btn btn-secondary">Ver servicios</button>
    <button class="btn btn-secondary hover">Ver servicios</button>
  </div>
</div>
<div class="section">
  <div class="lab">Ghost · solo texto</div>
  <div class="row">
    <a href="#" class="btn btn-ghost">Conocer al equipo →</a>
    <a href="#" class="btn btn-ghost hover">Conocer al equipo →</a>
  </div>
</div>
</body></html>
