<!doctype html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;background:#fff;font-family:var(--font-primary);color:var(--rs-text);}
.wrap{padding:22px;}
.spec{display:flex;flex-direction:column;gap:14px;}
.row{display:flex;align-items:baseline;gap:14px;}
.row .meta{width:120px;font-size:10px;color:var(--rs-text-subtle);text-transform:uppercase;letter-spacing:.08em;font-weight:600;}
.row .body{flex:1;}
.h1{font-family:var(--font-primary);font-weight:700;font-size:48px;line-height:1.1;letter-spacing:-0.02em;color:var(--rs-text);margin:0;}
.h2{font-family:var(--font-primary);font-weight:700;font-size:36px;line-height:1.2;letter-spacing:-0.01em;color:var(--rs-text);margin:0;}
.h3{font-family:var(--font-primary);font-weight:600;font-size:24px;line-height:1.3;color:var(--rs-text);margin:0;}
</style></head><body><div class="wrap"><div class="spec">
  <div class="row"><div class="meta">H1 · Bold 48</div><div class="body"><h1 class="h1">Tu negocio automatizado en días</h1></div></div>
  <div class="row"><div class="meta">H2 · Bold 36</div><div class="body"><h2 class="h2">No somos una agencia tradicional</h2></div></div>
  <div class="row"><div class="meta">H3 · SemiBold 24</div><div class="body"><h3 class="h3">Agente WhatsApp 24/7</h3></div></div>
</div></div></body></html>
