<!doctype html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;background:#fff;color:var(--rs-text);padding:22px;font-family:var(--font-primary);}
table{border-collapse:collapse;width:100%;font-size:12px;}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--rs-border-soft);}
th{font-size:10px;color:var(--rs-text-subtle);text-transform:uppercase;letter-spacing:.08em;font-weight:700;}
.f{font-weight:400;}
.b{font-weight:500;}
.c{font-weight:600;}
.d{font-weight:700;}
.e{font-weight:800;}
.demo{font-size:18px;}
</style></head><body>
<table>
  <thead><tr><th>Weight</th><th>Demo · "Rallusigence"</th><th>Use</th></tr></thead>
  <tbody>
    <tr><td>400 · Regular</td><td><span class="demo f">Rallusigence</span></td><td>Body, descripciones, párrafos</td></tr>
    <tr><td>500 · Medium</td><td><span class="demo b">Rallusigence</span></td><td>Botón texto, énfasis sutil</td></tr>
    <tr><td>600 · SemiBold</td><td><span class="demo c">Rallusigence</span></td><td>Labels, nav, H3, H4</td></tr>
    <tr><td>700 · Bold</td><td><span class="demo d">Rallusigence</span></td><td>H1, H2, precios, títulos</td></tr>
    <tr><td>800 · ExtraBold</td><td><span class="demo e">Rallusigence</span></td><td>Display ocasional, hero numbers</td></tr>
  </tbody>
</table>
</body></html>
