<!doctype html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;background:#fff;padding:22px;font-family:var(--font-primary);color:var(--rs-text);}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px;}
.tag{display:inline-flex;align-items:center;padding:4px 10px;background:rgba(32,180,177,.10);color:#20B4B1;font-family:ui-monospace,monospace;font-weight:600;font-size:13px;border-radius:4px;white-space:nowrap;}
.tag.free{background:rgba(16,185,129,.10);color:#10B981;}
.tag.feat{background:#20B4B1;color:#fff;}
.tag.strike{background:rgba(156,163,175,.10);color:#9CA3AF;text-decoration:line-through;opacity:.7;}
.lab{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--rs-text-subtle);font-weight:700;margin-bottom:6px;width:100%;}
.diff{display:flex;gap:14px;padding:10px 0;align-items:flex-start;}
.diff .ck{flex:none;width:22px;height:22px;border-radius:50%;background:#10B981;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;margin-top:2px;}
.diff h5{margin:0 0 2px;font-size:14px;font-weight:600;}
.diff p{margin:0;font-size:13px;color:#6B7280;line-height:1.5;}
</style></head><body>
<div class="row">
  <div class="lab">Price tags</div>
  <span class="tag">$12,000 MXN</span>
  <span class="tag free">Gratis</span>
  <span class="tag feat">Desde $5,000</span>
  <span class="tag strike">$25,000</span>
</div>
<div style="margin-top:14px;">
  <div class="lab">Differentiators</div>
  <div class="diff"><div class="ck">✓</div><div><h5>Sin intermediarios</h5><p>Hablas directo conmigo, no con un account manager.</p></div></div>
  <div class="diff"><div class="ck">✓</div><div><h5>Días, no meses</h5><p>Automatizamos en una semana, no en 90 días.</p></div></div>
</div>
</body></html>
