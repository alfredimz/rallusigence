<!doctype html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;background:#fff;color:var(--rs-text);padding:22px;font-family:var(--font-primary);}
.row{display:flex;align-items:center;gap:14px;margin-bottom:14px;border-bottom:1px solid var(--rs-border-soft);padding-bottom:12px;}
.row:last-child{border-bottom:none;}
.meta{width:140px;font-size:10px;color:var(--rs-text-subtle);text-transform:uppercase;letter-spacing:.08em;font-weight:600;}
.note{font-size:10px;color:var(--rs-text-subtle);margin-top:4px;font-weight:500;letter-spacing:0;text-transform:none;}
.body{flex:1;}
.s1{font-family:var(--font-elegant);font-weight:400;font-style:italic;font-size:28px;color:var(--rs-text);}
.s2{font-family:var(--font-creative);font-weight:400;font-size:28px;color:var(--rs-primary);}
.s3{font-family:var(--font-informal);font-weight:400;font-size:24px;color:var(--rs-text);}
.s4{font-family:var(--font-accent);font-weight:700;font-size:34px;color:var(--rs-text);letter-spacing:.02em;}
</style></head><body>
<div class="row"><div class="meta">Playfair Display<div class="note">Pull-quote, premium</div></div><div class="body"><span class="s1">"Cada día sin automatizar es dinero que se va."</span></div></div>
<div class="row"><div class="meta">Pacifico<div class="note">Social posts</div></div><div class="body"><span class="s2">¡Hola, México!</span></div></div>
<div class="row"><div class="meta">Patrick Hand<div class="note">Notas, WhatsApp</div></div><div class="body"><span class="s3">Tu bot ya está listo ✅</span></div></div>
<div class="row"><div class="meta">Amatic SC<div class="note">Materiales gráficos</div></div><div class="body"><span class="s4">AUDITORÍA GRATIS</span></div></div>
</body></html>
