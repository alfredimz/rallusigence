<!doctype html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;background:#fff;color:var(--rs-text);padding:22px;font-family:var(--font-primary);}
.row{display:flex;align-items:center;gap:14px;margin-bottom:10px;}
.bar{background:var(--rs-primary);height:14px;border-radius:3px;}
.lab{width:60px;font-size:11px;font-weight:600;}
.tok{font-family:ui-monospace,monospace;font-size:10.5px;color:var(--rs-text-muted);width:90px;}
.px{font-family:ui-monospace,monospace;font-size:11px;font-weight:600;color:var(--rs-text);}
h3{margin:0 0 12px;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--rs-text-subtle);font-weight:700;}
</style></head><body>
<h3>Spacing — 8px grid (--space-*)</h3>
<div class="row"><div class="lab">space-1</div><div class="bar" style="width:8px;"></div><div class="px">8 px</div><div class="tok">--space-1</div><div style="font-size:11px;color:var(--rs-text-muted);">micro · ícono ↔ texto</div></div>
<div class="row"><div class="lab">space-2</div><div class="bar" style="width:16px;"></div><div class="px">16 px</div><div class="tok">--space-2</div><div style="font-size:11px;color:var(--rs-text-muted);">elementos relacionados</div></div>
<div class="row"><div class="lab">space-3</div><div class="bar" style="width:24px;"></div><div class="px">24 px</div><div class="tok">--space-3</div><div style="font-size:11px;color:var(--rs-text-muted);">grupos de elementos</div></div>
<div class="row"><div class="lab">space-4</div><div class="bar" style="width:48px;"></div><div class="px">48 px</div><div class="tok">--space-4</div><div style="font-size:11px;color:var(--rs-text-muted);">entre secciones</div></div>
<div class="row"><div class="lab">space-5</div><div class="bar" style="width:80px;"></div><div class="px">80 px</div><div class="tok">--space-5</div><div style="font-size:11px;color:var(--rs-text-muted);">entre bloques principales</div></div>
</body></html>
