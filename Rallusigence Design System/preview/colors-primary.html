<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Primary color</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;font-family:var(--font-primary);color:var(--rs-text);}
  .wrap{padding:20px;}
  .row{display:flex;gap:14px;align-items:stretch;}
  .hero{flex:1;background:var(--rs-primary);border-radius:12px;padding:24px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;min-height:220px;position:relative;overflow:hidden;}
  .hero[data-copy]{cursor:copy;transition:transform .25s var(--ease-out-cubic), box-shadow .25s var(--ease-out-cubic);}
  .hero[data-copy]:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(32,180,177,.32);}
  .hex{font-family:ui-monospace,monospace;font-size:14px;letter-spacing:.04em;opacity:.92;}
  .name{font-weight:700;font-size:22px;letter-spacing:-0.01em;}
  .sub{font-size:12px;opacity:.85;max-width:220px;line-height:1.4;}
  .copy-hint{position:absolute;top:14px;right:14px;font-size:10px;text-transform:uppercase;letter-spacing:.1em;font-weight:600;opacity:.55;}
  .scale{flex:1;display:flex;flex-direction:column;gap:6px;}
  .step{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;border:1px solid var(--rs-border-soft);transition:border-color .2s ease, transform .2s ease;}
  .step[data-copy]:hover{border-color:var(--rs-primary);transform:translateX(2px);}
  .step .swatch{width:28px;height:28px;border-radius:6px;flex:none;}
  .step .label{font-size:11px;font-weight:600;flex:1;}
  .step .hexm{font-family:ui-monospace,monospace;font-size:10px;color:var(--rs-text-muted);}
</style></head><body>
<div class="wrap">
  <div class="row">
    <div class="hero" data-copy="#20B4B1" data-copy-label="#20B4B1" data-ripple="rgba(255,255,255,.45)">
      <div>
        <div style="font-size:11px;text-transform:uppercase;letter-spacing:.1em;opacity:.85;font-weight:600;">Primary identity</div>
        <div class="name" style="margin-top:8px;">Turquesa Rallusigence</div>
      </div>
      <div>
        <div class="hex">#20B4B1</div>
        <div class="sub">CTAs, logo, links activos, badges destacados, focus rings.</div>
      </div>
      <div class="copy-hint">tap → copy</div>
    </div>
    <div class="scale">
      <div class="step" data-copy="#10AE8F" data-copy-label="#10AE8F" data-ripple="rgba(16,174,143,.25)"><div class="swatch" style="background:#10AE8F;"></div><div class="label">Active / pressed</div><div class="hexm">#10AE8F</div></div>
      <div class="step" data-copy="#198C76" data-copy-label="#198C76" data-ripple="rgba(25,140,118,.25)"><div class="swatch" style="background:#198C76;"></div><div class="label">Hover</div><div class="hexm">#198C76</div></div>
      <div class="step" data-copy="#20B4B1" data-copy-label="#20B4B1" data-ripple="rgba(32,180,177,.25)"><div class="swatch" style="background:#20B4B1;border:1px solid rgba(0,0,0,.04);"></div><div class="label">Default</div><div class="hexm">#20B4B1</div></div>
      <div class="step" data-copy="#029E81" data-copy-label="#029E81" data-ripple="rgba(2,158,129,.25)"><div class="swatch" style="background:#029E81;"></div><div class="label">Verde turquesa alt</div><div class="hexm">#029E81</div></div>
      <div class="step" data-copy="rgba(32,180,177,0.10)" data-copy-label="α 0.10 ring" data-ripple="rgba(32,180,177,.18)"><div class="swatch" style="background:rgba(32,180,177,.10);"></div><div class="label">Tint 10% (rings)</div><div class="hexm">α 0.10</div></div>
    </div>
  </div>
</div>
<script src="_interactions.js"></script>
</body></html>
