<!doctype html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;background:#fff;padding:22px;font-family:var(--font-primary);color:var(--rs-text);}
.steps{position:relative;padding-left:18px;}
.steps::before{content:'';position:absolute;left:36px;top:30px;bottom:30px;width:2px;background:var(--rs-border);border-radius:2px;}
.steps::after{content:'';position:absolute;left:36px;top:30px;width:2px;height:0;background:linear-gradient(to bottom,#10B981,var(--rs-primary));border-radius:2px;animation:drawLine 2.6s var(--ease-out-cubic) forwards;animation-delay:.3s;}
@keyframes drawLine{to{height:calc(100% - 60px);}}
.step{display:flex;gap:18px;padding:14px 0;position:relative;opacity:0;transform:translateX(-12px);animation:stepIn .5s var(--ease-out-cubic) forwards;}
.step:nth-child(1){animation-delay:.4s;}
.step:nth-child(2){animation-delay:1.4s;}
.step:nth-child(3){animation-delay:2.4s;}
@keyframes stepIn{to{opacity:1;transform:translateX(0);}}
.num{flex:none;width:36px;height:36px;border-radius:50%;background:#fff;color:#20B4B1;display:flex;align-items:center;justify-content:center;font-weight:700;border:2px solid #20B4B1;box-shadow:0 0 0 3px rgba(32,180,177,.10);position:relative;z-index:1;transition:all .3s var(--ease-out-cubic);}
.num.done{background:#10B981;color:#fff;border-color:#10B981;box-shadow:0 0 0 3px rgba(16,185,129,.18);}
.num.done .check{display:block;}
.num .check{display:none;animation:popIn .35s var(--ease-out-cubic);}
@keyframes popIn{from{transform:scale(0) rotate(-180deg);}to{transform:scale(1) rotate(0);}}
.body h5{margin:0 0 2px;font-size:15px;font-weight:600;}
.body p{margin:0 0 6px;font-size:13px;color:#6B7280;line-height:1.5;}
.t{font-family:ui-monospace,monospace;font-size:11px;color:#20B4B1;font-weight:500;text-transform:uppercase;letter-spacing:.05em;}
.replay{margin-top:18px;padding:8px 14px;background:var(--rs-primary);color:#fff;border:none;border-radius:4px;font-family:inherit;font-weight:600;font-size:12px;cursor:pointer;}
</style></head><body>
<div class="steps" id="steps">
  <div class="step"><div class="num" data-step="1"><span class="num-text">1</span><svg class="check" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></div><div class="body"><h5>Auditoría</h5><p>Te revisamos gratis para saber qué automatizar primero.</p><div class="t">24 horas</div></div></div>
  <div class="step"><div class="num" data-step="2"><span class="num-text">2</span><svg class="check" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></div><div class="body"><h5>Configuración</h5><p>Programamos todo en 3-7 días mientras sigues trabajando.</p><div class="t">3-7 días</div></div></div>
  <div class="step"><div class="num" data-step="3"><span class="num-text">3</span><svg class="check" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></div><div class="body"><h5>Entrenamiento</h5><p>Te enseñamos a usar tus herramientas en 30 minutos.</p><div class="t">30 minutos</div></div></div>
</div>
<button class="replay" id="replay">↻ Reanimar</button>
<script>
const nums = document.querySelectorAll('.num');
function tickDone(){
  setTimeout(() => nums[0].classList.add('done'), 1200);
  setTimeout(() => nums[1].classList.add('done'), 2400);
  setTimeout(() => nums[2].classList.add('done'), 3600);
}
tickDone();
document.getElementById('replay').addEventListener('click', () => {
  const wrap = document.getElementById('steps');
  nums.forEach(n => n.classList.remove('done'));
  // restart the line + step animations by cloning
  const clone = wrap.cloneNode(true);
  wrap.parentNode.replaceChild(clone, wrap);
  clone.id = 'steps';
  setTimeout(() => {
    const newNums = document.querySelectorAll('.num');
    setTimeout(() => newNums[0].classList.add('done'), 1200);
    setTimeout(() => newNums[1].classList.add('done'), 2400);
    setTimeout(() => newNums[2].classList.add('done'), 3600);
  }, 50);
});
</script>
</body></html>
