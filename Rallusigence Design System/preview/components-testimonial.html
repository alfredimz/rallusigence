<!doctype html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;background:#fff;padding:22px;font-family:var(--font-primary);color:var(--rs-text);}
.testi{padding:24px 28px 24px 64px;background:#F9FAFB;border-radius:12px;position:relative;max-width:560px;}
.testi::before{content:'\201C';position:absolute;top:8px;left:18px;color:#20B4B1;font-weight:700;font-size:80px;line-height:1;opacity:.32;font-family:Georgia,serif;animation:quoteBreath 4.2s ease-in-out infinite;transform-origin:center;}
@keyframes quoteBreath{0%,100%{transform:scale(1);opacity:.32;}50%{transform:scale(1.08);opacity:.45;}}
.q{margin:0 0 16px;font-size:16px;line-height:1.6;font-style:italic;color:#2C2C2C;}
.who{display:flex;align-items:center;gap:12px;}
.av{width:40px;height:40px;border-radius:50%;background:rgba(32,180,177,.12);color:var(--rs-primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none;}
.name{font-size:13px;font-weight:600;}
.co{font-size:11px;color:#6B7280;text-transform:uppercase;letter-spacing:.05em;font-weight:500;margin-top:2px;}
.stars{display:inline-flex;gap:2px;margin-left:auto;color:#FFD31B;}
.stars svg{width:12px;height:12px;}
</style></head><body>
<div class="testi">
  <p class="q">Antes perdía clientes porque no podía responder WhatsApp en consulta. Ahora mi bot agenda automáticamente y solo me avisa los casos importantes.</p>
  <div class="who">
    <div class="av">RM</div>
    <div>
      <div class="name">Dr. Roberto Martínez</div>
      <div class="co">Clínica Dental · León, GTO</div>
    </div>
    <div class="stars">
      <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
    </div>
  </div>
</div>
</body></html>
