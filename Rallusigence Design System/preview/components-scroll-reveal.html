<!doctype html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;background:#fff;font-family:var(--font-primary);color:var(--rs-text);}
.wrap{padding:22px;}
h3{margin:0 0 12px;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--rs-text-subtle);font-weight:700;}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px;}
.tile{padding:16px;background:var(--rs-bg-soft);border-radius:8px;border:1px solid var(--rs-border-soft);position:relative;overflow:hidden;min-height:96px;display:flex;flex-direction:column;justify-content:flex-end;}
.tile .label{font-family:ui-monospace,monospace;font-size:10.5px;color:var(--rs-text-muted);}
.tile .name{font-size:13px;font-weight:600;margin-top:4px;color:var(--rs-text);}
.reveal{opacity:0;transform:translateY(30px);transition:opacity .6s cubic-bezier(0.16,1,0.3,1),transform .6s cubic-bezier(0.16,1,0.3,1);}
.reveal--left{transform:translateX(-50px);}
.reveal--right{transform:translateX(50px);}
.reveal--scale{transform:scale(0.95);}
.reveal.visible,.reveal--left.visible,.reveal--right.visible,.reveal--scale.visible{opacity:1;transform:none;}
.reveal--delay-1{transition-delay:.1s;} .reveal--delay-2{transition-delay:.2s;} .reveal--delay-3{transition-delay:.3s;}
.btn{margin:6px 0 14px;padding:8px 14px;border:1px solid var(--rs-primary);background:transparent;color:var(--rs-primary);border-radius:4px;cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;}
.btn:hover{background:rgba(32,180,177,.05);}
</style></head><body><div class="wrap">
<h3>Scroll-reveal variants — click to replay</h3>
<button class="btn" id="play">▶ Replay reveal</button>
<div class="row">
  <div class="tile reveal"><div class="label">.reveal</div><div class="name">Fade + slide up 30px</div></div>
  <div class="tile reveal reveal--left"><div class="label">.reveal--left</div><div class="name">Slide from -50px</div></div>
  <div class="tile reveal reveal--right"><div class="label">.reveal--right</div><div class="name">Slide from +50px</div></div>
  <div class="tile reveal reveal--scale"><div class="label">.reveal--scale</div><div class="name">Scale 0.95 → 1</div></div>
</div>
<h3>Cascade with --delay-1/2/3</h3>
<div class="row">
  <div class="tile reveal reveal--scale"><div class="label">.reveal--scale</div><div class="name">Card 1</div></div>
  <div class="tile reveal reveal--scale reveal--delay-1"><div class="label">+ delay-1 (.1s)</div><div class="name">Card 2</div></div>
  <div class="tile reveal reveal--scale reveal--delay-2"><div class="label">+ delay-2 (.2s)</div><div class="name">Card 3</div></div>
  <div class="tile reveal reveal--scale reveal--delay-3"><div class="label">+ delay-3 (.3s)</div><div class="name">Card 4</div></div>
</div>
</div>
<script>
function play(){
  document.querySelectorAll('.reveal').forEach(el => el.classList.remove('visible'));
  setTimeout(() => document.querySelectorAll('.reveal').forEach(el => el.classList.add('visible')), 50);
}
document.getElementById('play').addEventListener('click', play);
window.addEventListener('load', () => setTimeout(play, 200));
</script>
</body></html>
