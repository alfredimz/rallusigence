<!doctype html><html lang="es"><head><meta charset="utf-8"><title>WhatsApp preview</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;background:#F0F2F5;font-family:var(--font-primary);color:var(--rs-text);}
.wrap{padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:16px;}

.phone{background:#E5DDD5;border-radius:18px;overflow:hidden;height:480px;display:flex;flex-direction:column;box-shadow:0 8px 24px rgba(0,0,0,.10);position:relative;}
.phone .hdr{background:#075E54;color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;flex:none;}
.phone .av{width:32px;height:32px;border-radius:50%;background:#20B4B1;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.phone .av img{width:100%;height:100%;object-fit:cover;}
.phone .nm{font-size:13px;font-weight:600;}
.phone .st{font-size:10.5px;opacity:.85;}
.phone .body{flex:1;padding:14px 12px;overflow:hidden;display:flex;flex-direction:column;gap:6px;background-image:radial-gradient(rgba(0,0,0,.04) 1px, transparent 1px);background-size:18px 18px;}

.msg{max-width:78%;padding:7px 10px 16px;border-radius:8px;font-size:12.5px;line-height:1.35;position:relative;opacity:0;transform:translateY(8px);animation:msgIn .3s var(--ease-out-cubic) forwards;box-shadow:0 1px 0 rgba(0,0,0,.05);}
.msg .time{position:absolute;bottom:3px;right:8px;font-size:9px;color:rgba(0,0,0,.45);}
.msg.me .time{color:rgba(0,0,0,.4);}
.msg.me{align-self:flex-end;background:#DCF8C6;border-radius:8px 8px 2px 8px;}
.msg.them{align-self:flex-start;background:#fff;border-radius:8px 8px 8px 2px;}
.msg .check{display:inline-block;color:#34B7F1;margin-left:2px;font-size:9px;letter-spacing:-2px;}
@keyframes msgIn{to{opacity:1;transform:translateY(0);}}

.typing{align-self:flex-start;background:#fff;border-radius:8px 8px 8px 2px;padding:10px 14px;display:flex;gap:4px;box-shadow:0 1px 0 rgba(0,0,0,.05);opacity:0;animation:msgIn .3s var(--ease-out-cubic) forwards;}
.typing i{width:6px;height:6px;border-radius:50%;background:#9CA3AF;animation:dot 1s infinite ease-in-out;}
.typing i:nth-child(2){animation-delay:.15s;}
.typing i:nth-child(3){animation-delay:.3s;}
@keyframes dot{0%,80%,100%{transform:scale(.6);opacity:.5;}40%{transform:scale(1);opacity:1;}}

.bot-tag{display:inline-flex;align-items:center;gap:4px;font-size:9px;font-weight:700;letter-spacing:.06em;color:var(--rs-primary);text-transform:uppercase;margin-bottom:2px;}
.bot-tag::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--rs-primary);box-shadow:0 0 0 3px rgba(32,180,177,.18);}

.title-row{grid-column:1 / -1;display:flex;align-items:center;gap:10px;margin-bottom:-4px;}
.title-row h3{margin:0;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--rs-text-subtle);font-weight:700;}
.title-row .replay{margin-left:auto;padding:6px 12px;background:var(--rs-primary);color:#fff;border:none;border-radius:4px;font-family:inherit;font-weight:600;font-size:11px;cursor:pointer;}

.label{position:absolute;top:10px;right:12px;font-size:9px;font-weight:700;color:#fff;background:rgba(0,0,0,.25);padding:3px 8px;border-radius:10px;letter-spacing:.06em;text-transform:uppercase;}

.scene-2 .phone .hdr{background:#1F2C34;}
</style></head><body>
<div class="wrap">
  <div class="title-row">
    <h3>WhatsApp · Agente IA en acción</h3>
    <span class="sub" style="font-size:11px;color:var(--rs-text-muted);">Mensajes aparecen en cadencia natural — typing, respuesta, callback.</span>
    <button class="replay" id="replay">↻ reanimar</button>
  </div>

  <!-- Scene 1: Cliente agenda cita -->
  <div class="phone scene-1" id="s1">
    <div class="hdr">
      <div class="av"><img src="../assets/kiwi-icon.svg" alt=""></div>
      <div>
        <div class="nm">Clínica Sonrisa · Bot</div>
        <div class="st">en línea · responde 24/7</div>
      </div>
    </div>
    <div class="body" id="body1"></div>
    <span class="label">Agendar cita</span>
  </div>

  <!-- Scene 2: Filtro de leads -->
  <div class="phone scene-2" id="s2">
    <div class="hdr">
      <div class="av"><img src="../assets/kiwi-icon.svg" alt=""></div>
      <div>
        <div class="nm">Tienda Verde · Bot</div>
        <div class="st">califica leads &amp; pasa a humanos</div>
      </div>
    </div>
    <div class="body" id="body2"></div>
    <span class="label">Filtro de leads</span>
  </div>

</div>

<script>
const scenes = {
  1: [
    {who:'them', delay:200, type:0, html:'¡Hola! Quería ver si tienen disponibilidad para limpieza dental esta semana 👋'},
    {who:'them', delay:600, type:1200, html:'<div class="bot-tag">Asistente Kiwi</div>¡Hola! 😊 Tenemos disponibilidad jueves y viernes.<br>¿A qué hora te queda mejor?'},
    {who:'me', delay:1200, type:0, html:'Jueves a las 10am 👌'},
    {who:'them', delay:500, type:900, html:'<div class="bot-tag">Asistente Kiwi</div>Perfecto. ¿Me confirmas tu nombre y teléfono?'},
    {who:'me', delay:1100, type:0, html:'Roberto Méndez · 55-1234-5678'},
    {who:'them', delay:400, type:1100, html:'<div class="bot-tag">Asistente Kiwi</div>✓ Cita agendada<br><strong>Jue 9 May · 10:00 am</strong><br>Te llegará un recordatorio 1 día antes 🦷'},
  ],
  2: [
    {who:'them', delay:200, type:0, html:'Hola, vi su anuncio. ¿Tienen plantas para terraza?'},
    {who:'them', delay:600, type:1000, html:'<div class="bot-tag">Asistente Kiwi</div>¡Sí! 🌿 ¿Tu terraza recibe sol directo o sombra?'},
    {who:'me', delay:1100, type:0, html:'Sol todo el día'},
    {who:'them', delay:400, type:1100, html:'<div class="bot-tag">Asistente Kiwi</div>Perfecto. Te recomiendo: bugambilia, lavanda, romero.<br>¿Tu presupuesto está bajo $2,000 o arriba?'},
    {who:'me', delay:1000, type:0, html:'Arriba 💸'},
    {who:'them', delay:400, type:900, html:'<div class="bot-tag">Asistente Kiwi</div>Genial — te paso con Ana, nuestra paisajista, en un momento. 🌱'},
  ]
};

function timeNow(){
  const d = new Date();
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}

async function play(sceneId, bodyEl){
  bodyEl.innerHTML = '';
  const seq = scenes[sceneId];
  for (const step of seq){
    await wait(step.delay);
    if (step.type){
      const t = document.createElement('div');
      t.className = 'typing';
      bodyEl.appendChild(t);
      await wait(step.type);
      t.remove();
    }
    const m = document.createElement('div');
    m.className = 'msg ' + step.who;
    m.innerHTML = step.html + '<span class="time">' + timeNow() + (step.who==='me'?'<span class="check">✓✓</span>':'') + '</span>';
    bodyEl.appendChild(m);
  }
}
function wait(ms){return new Promise(r => setTimeout(r, ms));}

function start(){
  play(1, document.getElementById('body1'));
  setTimeout(() => play(2, document.getElementById('body2')), 600);
}
document.getElementById('replay').addEventListener('click', start);
start();
</script>
</body></html>
