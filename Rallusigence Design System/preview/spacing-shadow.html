<!doctype html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;background:#F9FAFB;padding:24px;font-family:var(--font-primary);color:var(--rs-text);}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;}
.tile{background:#fff;padding:18px;border-radius:8px;}
.lab{font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--rs-text-subtle);margin-bottom:10px;}
.meta{font-family:ui-monospace,monospace;font-size:10px;color:var(--rs-text-muted);margin-top:10px;}
.s1{box-shadow:0 1px 3px rgba(44,44,44,.10);}
.s2{box-shadow:0 4px 24px rgba(0,0,0,.08);}
.s3{box-shadow:0 4px 16px rgba(0,0,0,.10);}
.s4{box-shadow:0 4px 12px rgba(32,180,177,.15);}
</style></head><body>
<div class="grid">
  <div class="tile s1"><div class="lab">Light</div>incidental<div class="meta">0 1px 3px rgba(44,44,44,.10)</div></div>
  <div class="tile s2"><div class="lab">Card</div>form-card, secciones elevadas<div class="meta">0 4px 24px rgba(0,0,0,.08)</div></div>
  <div class="tile s3"><div class="lab">Hover</div>service-card al hover<div class="meta">0 4px 16px rgba(0,0,0,.10)</div></div>
  <div class="tile s4"><div class="lab">CTA glow (teal)</div>botón primario al hover<div class="meta">0 4px 12px rgba(32,180,177,.15)</div></div>
</div>
</body></html>
